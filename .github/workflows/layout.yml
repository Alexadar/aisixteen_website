# Cross-browser layout tests (Chromium, Firefox, WebKit; desktop and phone) on every PR.
# Builds the site first, so a PR whose build breaks fails here too. Deploys nothing.
name: Layout tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
